<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ankit Yadav - Courses</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f7fb;
        }

        h2 {
            text-align: center;
            background-color: #0077ff;
            color: white;
            padding: 15px;
            border-radius: 8px;
        }

        .images {
            text-align: center;
            margin: 20px 0;
        }

        .images img {
            width: 200px;
            height: 250px;
            object-fit: cover;
            margin: 10px;
            border-radius: 8px;
        }

        nav {
            text-align: center;
            margin: 20px 0;
        }

        nav a {
            display: inline-block;
            text-decoration: none;
            background-color: #0077ff;
            color: white;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 5px;
        }

        nav a:hover {
            background-color: #0056b3;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        caption {
            font-size: 22px;
            font-weight: bold;
            padding: 15px;
            color: #003366;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 14px;
            text-align: center;
        }

        th {
            background-color: #0077ff;
            color: white;
        }

        tbody tr:nth-child(even) {
            background-color: #eaf2ff;
        }

        tbody tr:hover {
            background-color: #d0e3ff;
        }

        @media (max-width: 600px) {
            table {
                width: 100%;
            }

            .images img {
                width: 130px;
                height: 130px;
            }
        }
    </style>
</head>

<body>

    <h2>Ankit Yadav</h2>

    <div class="images">
        <img src="images/campus.jpg" alt="Campus">
        <img src="images/Logo.jpg" alt="College Logo">
    </div>

    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="contact.html">Contact</a>
            <a href="courses.html">Courses</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <main>
        <h1>Our Courses</h1>

        <div class="table-container">
            <table>
                <caption>B.Sc. Courses 2026</caption>

                <thead>
                    <tr>
                        <th>S.No.</th>
                        <th>Course Name</th>
                        <th>Duration</th>
                        <th>Daily Study Time</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Computer Science</td>
                        <td>3 Years</td>
                        <td>5 Hours</td>
                    </tr>

                    <tr>
                        <td>2</td>
                        <td>Mathematics</td>
                        <td>3 Years</td>
                        <td>6 Hours</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

</body>
</html>
